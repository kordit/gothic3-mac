# globals.toml - the curated globals the kit's code reads. None has been
# identified in Gothic 3 yet, so each is a sentinel in the zero-filled tail of
# Gothic3Final.exe's .data (virtual size ends at 0x00427660, .rsrc starts
# at 0x00428000), which the game never references.

[globals.simulation_turn]
addr = 0x00427f60
size = 4

[globals.command_frame]
addr = 0x00427f64
size = 4

[globals.entity_base]
addr = 0x00427f70
size = 4
