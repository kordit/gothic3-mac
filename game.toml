prepare = "cab:d3dx9_40.dll"
base = 0x114a0000
size = 0x44a000
listings = "analysis/d3dx9_40.dll"
# The linker merged .rdata into .text: from the import table (0x114a1000)
# through GUIDs, constants and the load config (ends 0x11565610) up to the
# first function Ghidra lists (0x11565910) it is data. Recovering code there
# cost most of a 48-minute translation and kept 25 blocks of pointer tables
# and floats as functions.
data_in_code = [[0x114a1000, 0x11565910]]
# The kit serves its msvcrt.dll imports (D-019) except C++ exception dispatch:
# the copy of __CxxFrameHandler3 linked into the module (11687ba4) hands it to
# msvcrt's, which is SharedBase's statically linked VC8 CRT handler here
# (___CxxFrameHandler3, FuncInfo in EAX, magic 0x19930520 forced by the caller).
import_forwards = { "msvcrt.dll!__CxxFrameHandler" = 0x10084241 }
