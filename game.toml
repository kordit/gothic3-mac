# game.toml - what the kit needs to know about Gothic 3 (Steam beta cpt_1.75_testbranch, build 1037180)
# that is not derivable from the binaries. Addresses are guest addresses in the
# staged modules (tools/stage.py, stage.toml). Values marked "sentinel" are not
# identified yet: they point into the zero-filled tail of Gothic3Final.exe's
# .data (0x00427660-0x00427fff), which the game never references, so the kit's
# Populous-shaped hooks compile and never fire.

[game]
id = "gothic3"
name = "Gothic 3"
app_name = "Gothic3Recomp"
data_dir_name = "Gothic 3 Native"
bundle_id = "dev.recompkit.gothic3"
executable = "Gothic3Final.exe"
# Community Patch 1.75.14; Gothic3.exe is only its launcher.
sha256 = "5f1c521aeb89cdfd00919d5c48c1e29bb36c07d05c76af76ed55c486269211a0"
image_base = 0x00400000
entry_point = 0x00406275
guest_root = 'C:\Program Files\Gothic 3'
developer_exe = "stage/Gothic3Final.exe"
windows_version = "5.1.2600"
qpc_us = true
# GlobalMemoryStatusEx's RAM: below 1436 MB eCApplication::GetOptimalCacheSizes (Engine 10274a80) takes
# its smallest resource caches and the world's meshes are evicted as they load (D-024).
physical_memory_mb = 2048
# FMOD Ex's mixer, output and stream threads run without the baton (D-026, 25.10.2026: combat 37.7 -> 34.9 ms).
free_threads = "fmodex.dll"
# Gothic3Final.exe is large address aware: on 64-bit Windows it sees 4 GB of virtual memory and sizes its resource
# caches by it (D-028).
virtual_memory_mb = 4096
# 4 GB, what the large-address-aware Gothic3Final.exe gets on 64-bit Windows (D-022): with 2 GB a new game ran out
# of heap while loading the world. The modules end at 0x118ea000 (MSVCRT.DLL, which ended at 0x11930000, is gone:
# D-020); the rest above them is guest heap (the modules' own CRTs allocate from it).
guest_size = 0xffff0000
heap_extra_base = 0x11930000
heap_extra_size = 0xee6c0000

[game.adapter]
modes = "list"

[translate]
listings = "analysis/Gothic3Final.exe"
globals = "globals.toml"
# Sentinel: no audited animation counter.
animation_counter = 0x00427f00
volatile_reads = []
# Gothic 3 imports d3d9 only, never DirectDraw.
store_hooks = false
# Flags only where the body reads them, dead before a CALL and at a RET as MSVC's calling convention has them
# (kit translate.py liveness_abi; PhysXCore: 197k flag writes -> 30k, the same 4 split-off entries --check-flags lists).
flags_abi = true
# x87 values a body pushes stay in C locals until a call, a return, a jump out or an instruction that needs the
# stack in the context (kit translate.py x87_virtual, D-031; Engine: 6319 of 6725 x87 operations).
x87_locals = true
# Every indirect CALL keeps its last target (kit x86.h recomp_call_cached): imports between the DLLs
# and vtable calls were about a quarter of the samples while the game loads (D-023).
inline_call_cache = true
# Native replacements for hot game functions (native/g3_overrides.h, switched by G3OPT in
# trace.ctl, native/g3_opt.c). The header goes to every module; the sources build into the exe's
# library. Changing the header recompiles every module, the sources alone do not.
overrides = "native/g3_overrides.h"
native = { header = "native/g3_overrides.h", sources = ["native/g3_opt.c", "native/rand.c", "native/particles.c", "native/occlusion.c", "native/d3d.c", "native/strings.c", "native/memory.c", "native/audio.c", "native/vector.c", "native/scene.c", "native/leaf.c", "native/shadow.c", "native/console.c", "native/vfs.c", "native/cull.c", "native/ai.c", "native/exec.c", "native/pdo.c", "native/move.c", "native/uv.c", "native/zlib.c", "native/anim.c", "native/archive.c", "native/savegame.c", "native/mods.c"], libs = ["/opt/homebrew/lib/libdeflate.a"] }

[hooks]
# Sentinels.
frame_clock_begin = 0x00427f10
frame_clock_wait = 0x00427f14
frame_clock_wait_clamp = 0x00427f18
frame_clock_clamp_deadline = 0x00427f20
frame_clock_wait_deadline = 0x00427f24
cursor_surface_ptrs = [0x00427f30, 0x00427f34]
mouse_vtable = 0x00427f40
mouse_device_ptr = 0x00427f44
mouse_device_right = 0x00427f48
camera = 0x00427f50
sprites = []

[mods]
builtin = "none"

[settings]
rows = ["window", "frame_limit", "performance_overlay", "controls"]

[controls]
default_layout = "hidden"
pad = "mapped"

[launcher]
title = "Gothic 3"
store = "https://store.steampowered.com/app/39500/"
# The mods enabled for a player who never chose, where their Sefaris catalog has them (the set this port is
# played and measured with).
default_mods = ["World Texture Mix", "Better Sound Effects", "Animations Redone - Sword And Shield",
                "Animations Redone - Staffs and Halberds", "Animations Redone - Two Handed Swords",
                "Animations Redone - Unarmed Movement", "Animations Redone - Bows and Crossbows", "Achievements",
                "PL_Text_Fix"]
# The launcher at every start: mods, updates and uninstall are there.
always = true
# The install's compiled shaders into a new player's profile: without them the first start compiles thousands
# of shaders through d3dx9_40 before the menu (milestone 6.1).
profile_seed = ["Shader.Cache|Documents/gothic3/Shader.Cache"]
# Updates: the launcher installs the latest release's Gothic3Recomp-macOS.zip (tools/release.sh).
releases_repo = "kordit/gothic3-mac"
steam_ids = ["39500"]
install_names = ["Gothic 3", "Gothic III"]
min_free_mb = 500
# The launcher's "Mody (Sefaris)" screen reads this Sefaris Mod Manager catalog; the screen can point it elsewhere.
sefaris_dir = "~/Downloads/G3_Mods"
# Script mods redone in native/mods.c: shown as built in and always on (G3_NATIVE_MODS=none turns them off).
native_dlls = ["Script_FontScale.dll", "Script_Subtitles.dll"]
# The launcher's look (subtitle: the line under "ready to play"): Polish, the game's own font from the player's game folder for titles, a macOS serif for
# text, and a frame of the intro (the ship at sunset, before the credits) as the backdrop. Nothing is bundled.
language = "pl"
banner = "GOTHIC III"
subtitle = "Community Patch 1.75"
font_display = ["Gothic3.ttf"]
font_body = ["/System/Library/Fonts/Supplemental/Hoefler Text.ttc#0", "/System/Library/Fonts/Supplemental/Baskerville.ttc#0"]
font_strong = ["/System/Library/Fonts/Supplemental/Baskerville.ttc#4", "/System/Library/Fonts/Supplemental/Hoefler Text.ttc#1"]
backdrop_video = "Data/Video/G3_Intro.bik"
backdrop_seconds = 40.8

# The game from the player's Steam account (D-037): DepotDownloader beside the app's executable, logged in with a QR
# code or a password. CP 1.75.14 without redist/ (but the cabinet d3dx9_40 comes from) and modkit/; Polish speech
# alone from the public Polish depot, whose other files are 1.6's and would replace CP's.
[launcher.steam]
tool = "DepotDownloader"
tool_url = "https://github.com/SteamRE/DepotDownloader/releases/download/DepotDownloader_3.4.0/DepotDownloader-macos-arm64.zip"
tool_sha256 = "60e80c7c496f3f9a079cd3c62036b35d088c27bc0149baf38f009eb57a52f6a5"
tool_source = "https://github.com/SteamRE/DepotDownloader/tree/DepotDownloader_3.4.0"
app = 39500
# The game in Polish (CP's Strings carry the Polish text and subtitles), whatever was downloaded.
ini = ["Ini/ge3.ini|Language|Text=Polish", "Ini/ge3.ini|Language|Subtitle.SupportedCount=6",
       "Ini/ge3.ini|Language|Subtitle.Entry_5=Polish"]

[[launcher.steam.depots]]
id = 39501
manifest = "8013367546631285348"
branch = "cpt_1.75_testbranch"
files = ["regex:(?i)^(?!redist/|modkit/)", "redist/DirectX/Nov2008_d3dx9_40_x86.cab"]
mb = 3230

[[launcher.steam.depots]]
id = 39506
manifest = "7604240545982573629"
files = ["Data/Speech_Polish.pak"]
mb = 930
label = "Polski dubbing"
ini_on = ["Ini/ge3.ini|Language|Audio=Polish", "Ini/mountlist.ini||+Data/Speech_Polish=Data/Speech_Polish"]
ini_off = ["Ini/ge3.ini|Language|Audio=English", "Ini/mountlist.ini||-Data/Speech_Polish=Data/Speech_Polish"]

[setup]
required_dirs = ["Data", "Ini"]

[bundle]
exclude = []

