# d3dx9_40 imports 97 functions of the old system CRT (MSVCRT.DLL), which CP
# 1.75.14 does not ship: the kit serves them (kit/runtime/msvcrt.cpp, D-019, D-020).

# Modules end at 0x118ea000; the heap starts at 0x11930000, where MSVCRT.DLL ended.

# Waste Data Patch 2.0 (D-013, milestone 0.8): world data without the invisible
# objects under larger ones, repacked without compression. It replaces five
# archives of CP 1.75.14's Data/ and never touches code. tools/g3pak.py diff
# against CP: Templates change only by dropped strings (unused mesh and icon
# references, the designers' German notes on NPCs, a stale gCLetter_PS beside
# five books' gCBook_PS), no stat or property value. tools/stage.py extracts
# the files from the archive into stage/Data instead of linking the install's.
# `replaces` pins the CP file each one stands in for.
[[data]]
archive = "downloads/wastedata20/G3WD_V20.7z"
archive_sha256 = "d7bea0701e3a1fc9490310796a31aa784cce2293e7216de08240181da354bc01"
files = [
