# stage.toml - which files of the player's own Gothic 3 install the port uses,
# how each one is prepared, and where it lives in guest memory.
#
# Source pins are the Steam beta branch cpt_1.75_testbranch (app 39500, depot
# 39501, build 1037180: Community Patch 1.75.14; docs/DECISIONS.md D-011).
# tools/stage.py refuses any other file. Every DLL of this build carries
# .reloc, so all of them are rebased, packed from 0x10000000 in this order.
#
# Guest layout (the kit caps guest memory at 0x7ffff000):
#   0x00400000  Gothic3Final.exe at its own base
#   0x01000000  kit heap, stack, TEB, import shims (up to 0x10000000)
#   0x10000000  every module, 64 KB aligned, in this order
#   (end)       extra guest heap up to 0x7ffff000 (game.toml)

[source]
steam_app = 39500
steam_branch = "cpt_1.75_testbranch"
steam_build = 1037180

# The game itself; Gothic3.exe is only a launcher that starts it. No SteamStub on this branch.
